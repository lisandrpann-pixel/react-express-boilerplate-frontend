# Статика SPA + reverse-proxy API на backend:3000.
# Контейнеры в одной docker-сети, hostname сервиса = его имя.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SSE (/api/items/events) и прочие ответы API — без буферизации,
    # иначе события копятся в буфере nginx и до клиента не доходят
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location = /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # Swagger UI
    location /api-docs/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Статика: точные файлы, остальное — index.html (SPA routing)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
